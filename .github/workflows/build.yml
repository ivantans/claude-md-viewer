# Builds the app on macOS, Windows and Linux and uploads the installers as workflow artifacts.
# Nothing is published: artifacts are unsigned and only attached to the workflow run.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl file librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        working-directory: src-tauri
        run: cargo tauri build --target ${{ matrix.target }}

      - name: List .deb contents
        if: runner.os == 'Linux'
        run: dpkg-deb -c src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

      # The names match the download links in the README, which point at the latest release.
      - name: Collect installers
        shell: bash
        run: |
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir dist
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) cp "$bundle"/dmg/*.dmg dist/Claude-MD-Viewer-macOS-Apple-Silicon.dmg ;;
            x86_64-apple-darwin) cp "$bundle"/dmg/*.dmg dist/Claude-MD-Viewer-macOS-Intel.dmg ;;
            x86_64-pc-windows-msvc) cp "$bundle"/nsis/*.exe dist/Claude-MD-Viewer-Windows-x64-setup.exe ;;
            x86_64-unknown-linux-gnu)
              cp "$bundle"/deb/*.deb dist/Claude-MD-Viewer-Linux-amd64.deb
              cp "$bundle"/rpm/*.rpm dist/Claude-MD-Viewer-Linux-x86_64.rpm ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: claude-md-viewer-${{ matrix.target }}
          if-no-files-found: error
          path: dist/*

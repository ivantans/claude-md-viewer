<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude MD Viewer</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<header id="header">
  <button id="toc-toggle" title="Table of contents (⌘⇧O)" aria-label="Table of contents">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 4h1M6 4h7.5M2.5 8h1M6 8h7.5M2.5 12h1M6 12h7.5"/></svg>
  </button>
  <div id="breadcrumb"></div>
  <div id="default-offer" hidden>
    <span>Open Markdown files with Claude MD Viewer by default?</span>
    <button id="default-accept">Set as default</button>
    <button id="default-dismiss" title="Don't ask again" aria-label="Don't ask again">✕</button>
  </div>
</header>

<nav id="toc" aria-label="Table of contents"></nav>

<div id="find" hidden>
  <input id="find-input" type="search" placeholder="Find in document" autocomplete="off" spellcheck="false">
  <button id="find-close" aria-label="Close find">✕</button>
</div>

<main id="content">
  <div id="empty">
    <h1>Claude MD Viewer</h1>
    <p>Open a Markdown file with <kbd id="open-shortcut">⌘O</kbd>, or drop a <code>.md</code> file onto this window.</p>
  </div>
</main>

<script src="marked.min.js"></script>
<script src="viewer.js"></script>
</body>
</html>
